catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Build scripts de dependencias de los tipos de pi que no hacen falta (pnpm los rechaza en CI si no se declaran).
allowBuilds:
  "@google/genai": false
  protobufjs: false
